<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shubh's AI Assistant</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
    * {
        box-sizing: border-box;
    }
    body {
        font-family: 'Roboto', sans-serif;
        background: url("https://png.pngtree.com/thumb_back/fh260/background/20241019/pngtree-abstract-low-poly-style-of-artificial-intelligence-chatbot-robot-with-text-image_16417999.jpg");
        background-size: cover;
        background-position: center;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: end;
        margin: 0;
        overflow: hidden;
        padding-bottom: 70px;
    }
    .con {
        display: flex;
        flex-direction: column;
        color: white;
    }
    .con h1 {
        margin: 0;
        padding-left: 20px;
        padding-bottom: 10px;
    }
    #chat-container {
        width: 800px;
        max-height: 600px;  
        max-width: 100%;
        background: #2c9ee0;
        border-radius: 20px;
        box-shadow: 0 15px 50px rgba(27, 24, 27, 0.5);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        transform: perspective(1000px) rotateY(0deg);
        transition: transform 0.5s ease;
    }
    #chat-box {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    #chat-box::-webkit-scrollbar {
        width: 6px;
    }
    #chat-box::-webkit-scrollbar-thumb {
        background: rgba(0,0,0,0.3);
        border-radius: 10px;
    }
    .message {
        max-width: 75%;
        padding: 10px 15px;
        border-radius: 15px;
        opacity: 0;
        transform: translateY(20px);
        animation: slideIn 0.3s forwards;
        font-size: 14px;
        line-height: 1.4;
    }
    @keyframes slideIn {
        to { opacity: 1; transform: translateY(0); }
    }
    .user-message {
        align-self: flex-end;
        background: linear-gradient(135deg, #6dd5ed, #2193b0);
        color: #fff;
    }
    .bot-message {
        align-self: flex-start;
        background: linear-gradient(135deg, #ffecd2, #fcb69f);
        color: #000;
    }
    #controls {
        display: flex;
        padding: 15px;
        background: #2a2a2a;
        gap: 10px;
        align-items: center;
    }
    #user-input {
        flex: 1;
        padding: 10px 15px;
        border-radius: 50px;
        border: none;
        outline: none;
        background: #333;
        color: #fff;
        font-size: 14px;
    }
    #user-input:focus {
        box-shadow: 0 0 10px #6dd5ed;
    }
    .btn {
        background: #6dd5ed;
        border: none;
        border-radius: 50%;
        padding: 10px 14px;
        cursor: pointer;
        font-size: 16px;
        color: #fff;
    }
    .btn:hover {
        transform: scale(1.1);
        box-shadow: 0 0 15px #6dd5ed;
    }
</style>
</head>
<body>
<div class="con">
    <h1>Shubh's AI Assistant</h1>
    <div id="chat-container">
        <div id="chat-box"></div>
        <div id="controls">
            <input type="text" id="user-input" placeholder="Type a message...">
            <button id="send-btn" class="btn">➤</button>
            <button id="voice-btn" class="btn">🎤</button>
        </div>
    </div>
</div>

<script>
const sendBtn = document.getElementById("send-btn");
const voiceBtn = document.getElementById("voice-btn");
const userInput = document.getElementById("user-input");
const chatBox = document.getElementById("chat-box");

function addMessage(message, sender) {
    const msgDiv = document.createElement("div");
    msgDiv.textContent = message;
    msgDiv.className = "message " + (sender === "user" ? "user-message" : "bot-message");
    chatBox.appendChild(msgDiv);

    chatBox.scrollTop = chatBox.scrollHeight;
}


async function sendMessage(message, isVoice=false) { 
    if (!message) return;
    addMessage(message, "user");
    userInput.value = "";

    try {
        const response = await fetch("/chat", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({message, tts: isVoice}) 
        });
        const data = await response.json();
        addMessage(data.reply, "bot");

        if(data.tts){
            const utterance = new SpeechSynthesisUtterance(data.reply);
            speechSynthesis.speak(utterance);
        }
    } catch(e) {
        console.log("Frontend fetch error:", e);
    }
}

sendBtn.addEventListener("click", () => sendMessage(userInput.value.trim(), false));

userInput.addEventListener("keypress", (e) => {
    if(e.key === "Enter") {
        e.preventDefault();
        sendMessage(userInput.value.trim(), false);
    }
});

voiceBtn.addEventListener("click", () => {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) return alert("Use Chrome/Edge for voice support");

    const recognition = new SpeechRecognition();
    recognition.lang = "en-IN";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.start();
    recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        userInput.value = transcript;
        sendMessage(transcript, true); 
    };
    recognition.onerror = (e) => console.log("Voice error:", e.error);
});
</script>
</body>
</html>
